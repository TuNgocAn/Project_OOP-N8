# ==============================================================
# CẤU HÌNH MYSQL NẾU SỬ DỤNG DATABASE NGOÀI
# Kích hoạt bằng cách thêm cờ: --spring.profiles.active=mysql
# ==============================================================

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bus_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
