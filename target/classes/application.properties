# ==============================================================
# HỆ THỐNG QUẢN LÝ BẾN XE KHÁCH - CẤU HÌNH APPLICATION
# ==============================================================

# Cổng máy chủ theo yêu cầu nghiệp vụ
server.port=8080

# Cấu hình Spring Application
spring.application.name=BusManagement-System

# Cấu hình CSDL H2 In-Memory (Chạy ngay lập tức không cần cài MySQL)
spring.datasource.url=jdbc:h2:mem:busdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Kích hoạt bảng điều khiển H2 Console tại: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Cấu hình Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình JSON Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Cấu hình Static Resources (Web Frontend)
spring.web.resources.static-locations=classpath:/static/
